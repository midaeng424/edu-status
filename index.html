/* Layout: 상단 바(제목 · 탭 · 잠금) → 탭별 화면 하나씩. 대시보드는 6개 교육 카드만, 세부는 교육별 현황 탭으로 */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EDF0F5; --line:#DFE4EB;
  --ink:#17212D; --ink2:#4B5767; --ink3:#808B9A;
  --accent:#2549B8; --accent-soft:#E6ECFB;
  --ok:#1E8A55; --ok-soft:#DFF2E7; --warn:#B7791F; --warn-soft:#FBF0DC; --crit:#C2413A; --crit-soft:#F9E3E1; --none:#A9B2BE;
  --f-body:"Malgun Gothic","맑은 고딕",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-num:var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151C; --surface:#18202A; --sunk:#212B37; --line:#2C3846;
  --ink:#E8EDF4; --ink2:#AEB8C6; --ink3:#7E8A9A; --accent:#7E9CFF; --accent-soft:#232F4D;
  --ok:#4FC38A; --ok-soft:#173326; --warn:#E3A84A; --warn-soft:#3A2C14; --crit:#F07A72; --crit-soft:#3D1D1B; --none:#5D6877; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202A; --sunk:#212B37; --line:#2C3846;
  --ink:#E8EDF4; --ink2:#AEB8C6; --ink3:#7E8A9A; --accent:#7E9CFF; --accent-soft:#232F4D;
  --ok:#4FC38A; --ok-soft:#173326; --warn:#E3A84A; --warn-soft:#3A2C14; --crit:#F07A72; --crit-soft:#3D1D1B; --none:#5D6877; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
h1,h2,h3{margin:0;text-wrap:balance}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.inner{max-width:1120px;margin:0 auto}

/* 상단 바 */
.bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;top:0;right:0;left:0;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar .inner{display:flex;align-items:center;gap:8px 24px;flex-wrap:wrap;padding-top:12px;padding-bottom:0}
.brand{display:flex;flex-direction:column;margin-right:auto;padding-bottom:10px}
.brand b{font-size:1.05rem}
.brand span{font-size:.76rem;color:var(--ink3)}
.lockbtn{border:0;background:none;color:var(--ink3);font-size:.8rem;padding:4px 0 10px}
.lockbtn:hover{color:var(--ink)}
.nav{display:flex;gap:2px;overflow-x:auto;width:100%;margin-bottom:-1px}
.nav button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-top:28px;padding-bottom:96px}
.view{display:flex;flex-direction:column;gap:28px}
.vhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.vhead h1{font-size:1.4rem}
.vhead p{margin:4px 0 0;color:var(--ink2);font-size:.9rem}

/* 공통 */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;font-size:.86rem;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger:hover{border-color:var(--crit);color:var(--crit)}
select,input[type=search],input[type=password]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;max-width:100%;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:.82rem;font-weight:600;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-head h2{font-size:1rem}
.empty{padding:28px;text-align:center;color:var(--ink3);background:var(--sunk);border-radius:12px;font-size:.9rem}
.mini{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.mini i{display:block;height:100%;border-radius:3px}
.chip{display:inline-block;font-size:.74rem;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap}

const yearOf=(c,d)=>{const m=String(c).match(/(20\d{2})/);return m?m[1]:String(d||'').slice(0,4)};
const normName=c=>String(c).replace(/20\d{2}/g,'').replace(/DAMG/gi,'').replace(/\s+/g,' ').trim();
function normPub(){if(PUB&&PUB.courses&&!PUB.years){const c=PUB.courses[0];PUB={updated:PUB.updated,years:{[yearOf(c.c,c.snaps[0].date)]:{courses:PUB.courses}}}}}
const YRS=()=>PUB&&PUB.years?Object.keys(PUB.years).sort():[];
function ensureYear(){const ys=YRS();if(!U.year||!ys.includes(U.year))U.year=ys[ys.length-1]}
const YC=y=>(PUB.years[y||U.year]||{courses:[]}).courses;
function slots(y){const by={},extra=[];for(const c of YC(y)){if(c.slot&&!by[c.slot])by[c.slot]=c;else extra.push(c)}return {by,extra}}

function viewHome(){
  const {by,extra}=slots();
  const card=(label,c,sh)=>{const L=`<span class="lf">${label}</span><span class="sf">${sh||label}</span>`;if(!c)return `<div class="ccard off"><div class="t"><b>${L}</b></div><span class="r">예정</span><div class="mini"></div><div class="m"><span>아직 진행 전</span></div></div>`;
    const s=c.snaps[c.snaps.length-1],t=T(s.by[''].t);
    const g=['사무직','비사무직'].filter(x=>s.by[x]).map(x=>`${x} ${f1(T(s.by[x].t).rate)}%`).join(' · ');
    return `<button class="ccard" data-open="${esc(c.c)}"><div class="t"><b>${L}</b>${dShort(c.due,t.miss===0)}</div><span class="r" style="color:${rateColor(t.rate)}">${f1(t.rate)}%</span><div class="mini"><i style="width:${t.rate}%;background:${rateColor(t.rate)}"></i></div><div class="m"><span class="num mh">이수 ${nf(t.done)} / ${nf(t.total)}명</span><span>미수강 <b class="num">${nf(t.miss)}</b>명${t.ing?` <span class="muted mh">(수강중 ${nf(t.ing)})</span>`:''}</span></div>${g?`<div class="g">${g}</div>`:''}</button>`};
  return `<div class="view"><div class="vhead"><div><h1>${U.year} 법정의무교육</h1><p>카드를 누르면 국실본부별 현황과 미수강자·수강중 명단을 볼 수 있어요.</p></div></div>
    <div class="cards">${SLOTS.map(s=>card(s.label,by[s.k],s.s)).join('')}${extra.map(c=>card(esc(c.c),c)).join('')}</div></div>`;
}

/* 표 머리글 눌러 정렬 (오름차순 ▲ / 내림차순 ▼) */
function lsTh(key,k,l,cls){const s=(U.ls||{})[key]||{};const on=s.k===k;return `<th class="${cls||''}${on?' sorted':''}"><button data-ls="${key}|${k}">${l}${on?(s.d==='asc'?' ▲':' ▼'):''}</button></th>`}
function lsSort(key,list,get){const s=(U.ls||{})[key];if(!s||!s.k)return list;const dir=s.d==='asc'?1:-1;get=get||((r,k)=>r[k]);
  return list.slice().sort((a,b)=>{const va=get(a,s.k),vb=get(b,s.k);return (typeof va==='number'&&typeof vb==='number'?va-vb:String(va??'').localeCompare(String(vb??''),'ko',{numeric:true}))*dir})}

function viewCourse(){
  const {by,extra}=slots();
  if(!U.sel||!YC().some(c=>c.c===U.sel))U.sel=(by.h2||by.ac||YC()[0]).c;
  const order=[...SLOTS.map(s=>[s.label,by[s.k]]),...extra.map(c=>[c.c,c])];
  const C=YC().find(c=>c.c===U.sel);const n=C.snaps.length;
  let si=U.snap[C.c];if(si==null||si>=n)si=n-1;const S=C.snaps[si],P=si>0?C.snaps[si-1]:null;
  const hasG=!!S.by['사무직'];if(!hasG||!S.by[U.g])U.g='';
  const cur=S.by[U.g],t=T(cur.t),prev=P&&P.by[U.g]?P.by[U.g]:null;
  const prevD={};if(prev)for(const d of prev.d)prevD[d[0]]=pct(d[2],d[1]);
  const depts=cur.d.map(d=>{const x=T(d.slice(1,5));return {d:d[0],...x,teams:d[5],delta:prev&&d[0] in prevD?x.rate-prevD[d[0]]:null}});
  const {k:sk,d:sd}=U.sort,dir=sd==='asc'?1:-1;
  depts.sort((a,b)=>{const va=sk==='delta'?(a.delta??-999):a[sk],vb=sk==='delta'?(b.delta??-999):b[sk];return (typeof va==='string'?va.localeCompare(vb):va-vb)*dir||b.total-a.total});
  const th=(k,l,r)=>`<th class="${r?'r ':''}${sk===k?'sorted':''}"><button data-sort="${k}">${l}${sk===k?(sd==='asc'?' ▲':' ▼'):''}</button></th>`;
  const bar=r=>`<div class="bar8"><i style="width:${r}%;background:${rateColor(r)}"></i></div>`;
  const allD=depts.map(x=>x.d).sort();if(U.my&&!allD.includes(U.my))U.my='';
  const shown=U.my?depts.filter(x=>x.d===U.my):depts;
  const rows=shown.map(x=>{const op=U.my?U.open[x.d]!==false:U.open[x.d];let h=`<tr class="dept${op?' open':''}" data-dept="${esc(x.d)}" tabindex="0" aria-expanded="${op?'true':'false'}"><td><span class="caret">›</span> ${esc(x.d)}</td><td class="r num mh">${nf(x.total)}</td><td class="r num mh">${nf(x.done)}</td><td class="r num">${nf(x.miss)}</td><td class="r num hs">${nf(x.ing)}</td><td class="r num" style="color:${rateColor(x.rate)};font-weight:600">${f1(x.rate)}%</td><td class="hs">${bar(x.rate)}</td>${P?`<td class="r mh">${x.delta==null?'<span class="muted">–</span>':`<span class="delta ${x.delta>0.05?'up':x.delta<-0.05?'down':''}">${x.delta>=0?'+':''}${f1(x.delta)}%p</span>`}</td>`:''}</tr>`;
    if(op)h+=x.teams.map(z=>({tm:z[0],...T(z.slice(1,5))})).sort((a,b)=>a.rate-b.rate).map(z=>`<tr class="team"><td>${esc(z.tm)}</td><td class="r num mh">${nf(z.total)}</td><td class="r num mh">${nf(z.done)}</td><td class="r num">${nf(z.miss)}</td><td class="r num hs">${nf(z.ing)}</td><td class="r num">${f1(z.rate)}%</td><td class="hs">${bar(z.rate)}</td>${P?'<td class="mh"></td>':''}</tr>`).join('');return h}).join('')
    +(U.my?'':`<tr class="total"><td>합계</td><td class="r num mh">${nf(t.total)}</td><td class="r num mh">${nf(t.done)}</td><td class="r num">${nf(t.miss)}</td><td class="r num hs">${nf(t.ing)}</td><td class="r num">${f1(t.rate)}%</td><td class="hs"></td>${P?'<td class="mh"></td>':''}</tr>`);
  const myX=U.my?depts.find(x=>x.d===U.my):null;
  const gside=hasG?`<div class="side"><div class="lab">구분별</div>${['사무직','비사무직'].map(g=>{const x=T(S.by[g].t);return `<div class="gl"><div class="top"><span>${g}</span><span class="num" style="color:${rateColor(x.rate)};font-weight:600">${f1(x.rate)}% <span class="muted" style="font-weight:400">(${nf(x.done)}/${nf(x.total)})</span></span></div><div class="mini"><i style="width:${x.rate}%;background:${rateColor(x.rate)}"></i></div></div>`}).join('')}</div>`:'<div></div>';

  // 미이수자 (이름·상태·진행률만)
  if(!['all','none','ing'].includes(U.pk))U.pk='all';const PKN={all:0,none:0,ing:0};for(const r of (S.p||[]))if((!U.g||r[5]===U.g)&&(!U.my||r[0]===U.my)){PKN.all++;PKN[r[3]==='수강중'?'ing':'none']++}const PK=U.pk,PKL={all:'미수강',none:'미신청',ing:'수강중'}[PK];
  const pend=(S.p||[]).filter(r=>(!U.g||r[5]===U.g)&&(!U.my||r[0]===U.my)&&(PK==='all'||(r[3]==='수강중')===(PK==='ing'))).map(r=>({dept:r[0],team:r[1],name:r[2],st:r[3],prog:r[4],g:r[5]}));
  const teamTotal={},teamDone={};for(const d of cur.d)for(const z of d[5]){teamTotal[d[0]+'\u0001'+z[0]]=z[1];teamDone[d[0]+'\u0001'+z[0]]=z[2]}
  const tg={};for(const r of pend){const k=r.dept+'\u0001'+r.team;(tg[k]=tg[k]||[]).push(r)}
  const teams=Object.keys(tg).map(k=>{const [d,tm]=k.split('\u0001');return {k,d,tm,list:tg[k].sort((a,b)=>a.name.localeCompare(b.name)),total:teamTotal[k]||tg[k].length}}).sort((a,b)=>b.list.length-a.list.length||a.d.localeCompare(b.d));
  const ptable=L=>`<table class="itbl"><thead><tr><th><span>이름</span></th>${hasG?'<th><span>구분</span></th>':''}<th><span>상태</span></th><th class="r"><span>진행률</span></th></tr></thead><tbody>${L.map(r=>`<tr><td>${esc(r.name)}</td>${hasG?`<td>${esc(r.g||'–')}</td>`:''}<td><span class="chip ${chipCls(r.st)}">${esc(r.st)}</span></td><td class="r num">${r.prog}%</td></tr>`).join('')}</tbody></table>`;
  let sub='';
  if(U.sub==='team')sub=teams.length?`<div class="scroll"><table><thead><tr><th><span>국실본부 · 소속</span></th><th class="r"><span>${PKL}</span></th><th class="r"><span>수강률</span></th></tr></thead><tbody>${teams.map((x,i)=>`<tr class="dept${U.topen[x.k]?' open':''}" data-tview="${i}" tabindex="0" aria-expanded="${U.topen[x.k]?'true':'false'}"><td><span class="caret">›</span> ${esc(x.d)} <span class="muted" style="font-weight:400">·</span> ${esc(x.tm)}</td><td class="r num" style="color:${PK==='ing'?'var(--warn)':'var(--crit)'};font-weight:600">${nf(x.list.length)} <span class="muted" style="font-weight:400">/ ${nf(x.total)}</span></td><td class="r num">${f1(pct(teamDone[x.k]||0,x.total))}%</td></tr>${U.topen[x.k]?`<tr class="tdetail"><td colspan="3">${ptable(x.list)}</td></tr>`:''}`).join('')}</tbody></table></div>`:`<div class="empty">${PKL}인 사람이 없어요.</div>`;
  else{const L=pend.slice().sort((a,b)=>a.dept.localeCompare(b.dept)||a.team.localeCompare(b.team)||a.name.localeCompare(b.name));
    sub=`<div class="muted num" style="margin-bottom:10px;font-size:.84rem">${U.my?esc(U.my)+' · ':''}${nf(L.length)}명</div>
      <div class="scroll"><table><thead><tr>${lsTh('vl','dept','국실본부')}${lsTh('vl','team','소속')}${lsTh('vl','name','이름')}${hasG?lsTh('vl','g','구분'):''}${lsTh('vl','st','상태')}${lsTh('vl','prog','진행률','r')}</tr></thead><tbody>${lsSort('vl',L,(r,k)=>k==='prog'?+r.prog:r[k]).map(r=>`<tr><td>${esc(r.dept)}</td><td>${esc(r.team)}</td><td>${esc(r.name)}</td>${hasG?`<td>${esc(r.g||'–')}</td>`:''}<td><span class="chip ${chipCls(r.st)}">${esc(r.st)}</span></td><td class="r num">${r.prog}%</td></tr>`).join('')||`<tr><td colspan="6" class="muted">${PKL}인 사람이 없어요.</td></tr>`}</tbody></table></div>`}
  U._teams=teams;U._C=C;

  return `<div class="view">
    <div class="pills">${order.map(([l,cc])=>`<button ${cc?`data-pick="${esc(cc.c)}"`:'disabled'} class="${cc&&cc.c===C.c?'on':''}">${esc(l)}</button>`).join('')}</div>

function viewProxy(){
  const X=(PUB.years[U.year]||{}).proxy;
  if(!X)return `<div class="view"><div class="vhead"><div><h1>${U.year} 대리수강 현황</h1></div></div><div class="empty">${U.year}년 대리수강 현황이 아직 없어요.</div></div>`;
  const rows=X.list.map(r=>({dept:r[0],team:r[1],name:r[2],missed:r[3],all:!!r[4],px:r[5]}));
  const depts=[...new Set(rows.map(r=>r.dept))].sort();const my=depts.includes(U.my)?U.my:'';
  const F={all:r=>r.all,two:r=>r.missed.length>=2,px:r=>!!r.px};if(!F[U.pf])U.pf='all';
  const mine=rows.filter(r=>!my||r.dept===my),cnt=k=>mine.filter(F[k]).length;
  const list=mine.filter(F[U.pf]).sort((a,b)=>(a.px?1:0)-(b.px?1:0)||b.missed.length-a.missed.length||a.dept.localeCompare(b.dept)||a.team.localeCompare(b.team)||a.name.localeCompare(b.name));
  const allN=cnt('all'),doneN=mine.filter(r=>r.all&&r.px).length,rate=allN?doneN/allN*100:0;
  const seg=(k,t,d)=>`<button class="pxs${U.pf===k?' on':''}" data-pf="${k}"><span class="pxs-t">${t}</span><span class="pxs-n num">${nf(cnt(k))}<small>명</small></span><span class="pxs-d">${d}</span></button>`;
  return `<div class="view"><div class="vhead"><div><h1>${U.year} 대리수강 현황</h1><p>기준 교육을 듣지 않은 사람과 대리수강 진행 상황이에요.</p></div></div>
    <section class="box pxbox">
      <div class="pxbase"><span class="lab2">기준 교육</span><div class="pb-list">${X.base.map(b=>`<span class="ctag">${esc(b[0])}<span class="cd">${md(b[1])}</span></span>`).join('')}</div>
        <select id="mySel" aria-label="국실본부 선택" class="mysel"><option value="">전체 국실본부</option>${depts.map(d=>`<option${d===my?' selected':''}>${esc(d)}</option>`).join('')}</select></div>
      <div class="pxsegs">${seg('all','대리수강 대상','기준 교육 모두 미수강')}${seg('two','반복 미이수','2개 이상 미수강')}${seg('px','대리수강 진행','진행 중인 사람')}</div>
      <div class="pxprog"><span class="lab2">진행률</span><div class="pxbar"><i style="width:${rate}%"></i></div><span class="num"><b>${nf(doneN)}</b> / ${nf(allN)}명</span></div>
    </section>
    <section><div class="sec-head"><h2>${{all:'대리수강 대상',two:'반복 미이수',px:'대리수강 진행'}[U.pf]} <span class="muted num" style="font-weight:500">${nf(list.length)}명</span></h2></div>
      <div class="plist"><div class="phead"><span>이름 · 소속</span><span>미수강 교육</span><span>대리수강</span></div>
      ${list.map(r=>`<div class="prow${r.px?' done':''}"><div class="pr-who"><b>${esc(r.name)}</b><span class="pr-org">${esc(r.dept)} · ${esc(r.team)}</span></div><div class="pr-miss"><span class="pr-l">미수강 교육</span>${r.missed.map(m=>`<span class="mtag">${esc(m)}</span>`).join('')}</div><div class="pr-act">${r.px?`<span class="chip pxok">✓ 진행 ${md(r.px)}</span>`:''}</div></div>`).join('')||'<div class="empty" style="border-radius:0">해당하는 사람이 없어요.</div>'}</div></section></div>`;
}

function viewCompare(){
  const yrs=YRS();const sums={};
  for(const y of yrs){const r={};for(const c of YC(y)){const k=c.slot||('x:'+normName(c.c));if(r[k])continue;const S=c.snaps[c.snaps.length-1];r[k]={t:T(S.by[''].t),d:S.by[''].d}}sums[y]=r}
  const keys=SLOTS.map(s=>[s.k,s.label]);const seen=new Set(keys.map(k=>k[0]));
  for(const y of yrs)for(const c of YC(y)){const k=c.slot||('x:'+normName(c.c));if(!seen.has(k)){seen.add(k);keys.push([k,normName(c.c)])}}
  const last=yrs[yrs.length-1],prev=yrs.length>1?yrs[yrs.length-2]:null;
  const cell=x=>x?`<td class="r"><span class="num" style="color:${rateColor(x.t.rate)};font-weight:600">${f1(x.t.rate)}%</span><div class="muted num" style="font-size:.74rem">${nf(x.t.done)}/${nf(x.t.total)}</div></td>`:'<td class="r muted">–</td>';
  const dlt=(a,b)=>{if(!a||!b)return '<td class="r muted">–</td>';const d=a.t.rate-b.t.rate;return `<td class="r"><span class="delta ${d>0.05?'up':d<-0.05?'down':''}">${d>=0?'+':''}${f1(d)}%p</span></td>`};
  const head=`${yrs.map(y=>`<th class="r"><span>${y}년</span></th>`).join('')}${prev?`<th class="r"><span>${last} 전년 대비</span></th>`:''}`;
  const rows=keys.map(([k,l])=>`<tr><td><b>${esc(l)}</b></td>${yrs.map(y=>cell(sums[y][k])).join('')}${prev?dlt(sums[last][k],sums[prev][k]):''}</tr>`).join('');
  const avail=keys.filter(([k])=>yrs.some(y=>sums[y][k]));
  if(!U.cmpSlot||!avail.some(a=>a[0]===U.cmpSlot))U.cmpSlot=(avail.find(a=>a[0]==='h2')||avail[0])[0];
  const dm={};for(const y of yrs){const x=sums[y][U.cmpSlot];if(!x)continue;for(const d of x.d)(dm[d[0]]=dm[d[0]]||{})[y]={t:T(d.slice(1,5))}}
  const drows=Object.keys(dm).sort((a,b)=>{const A=dm[a][last],B=dm[b][last];return (A?A.t.rate:999)-(B?B.t.rate:999)}).map(d=>`<tr><td>${esc(d)}</td>${yrs.map(y=>cell(dm[d][y])).join('')}${prev?dlt(dm[d][last],dm[d][prev]):''}</tr>`).join('');
  return `<div class="view"><div class="vhead"><div><h1>연도별 비교</h1><p>교육별 최종 수강률을 연도별로 나란히 봐요. 각 연도의 가장 마지막 기준일 현황이에요.</p></div></div>
    ${yrs.length<2?'<div class="empty" style="padding:14px">지금은 한 해 자료만 있어요. 다음 해 수강현황이 쌓이면 나란히 비교돼요.</div>':''}
    <section><div class="box" style="padding:6px 8px"><div class="tbl-wrap"><table><thead><tr><th><span>교육</span></th>${head}</tr></thead><tbody>${rows}</tbody></table></div></div></section>
    <section><div class="sec-head"><h2>국실본부별 비교</h2></div>
      <div class="pills" style="margin-bottom:12px">${avail.map(([k,l])=>`<button data-cslot="${esc(k)}" class="${k===U.cmpSlot?'on':''}">${esc(l)}</button>`).join('')}</div>
      <div class="box" style="padding:6px 8px"><div class="tbl-wrap"><table><thead><tr><th><span>국실본부</span></th>${head}</tr></thead><tbody>${drows}</tbody></table></div></div></section></div>`;
}

function render(){
  const root=$('#root');const fa=document.activeElement,fk=fa&&fa.dataset?(fa.dataset.dept!=null?'tr[data-dept="'+CSS.escape(fa.dataset.dept)+'"]':fa.dataset.tview!=null?'tr[data-tview="'+fa.dataset.tview+'"]':''):'';
  setTimeout(()=>{if(fk){const el=document.querySelector(fk);if(el)el.focus()}},0);
  if(window.__LOADING){root.innerHTML=shell(`<div class="empty">${window.__FAILED?'현황을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.':'현황을 불러오는 중이에요…'}</div>`);return}
  normPub();if(!YRS().length){root.innerHTML=shell('<div class="empty">아직 공개된 수강현황이 없어요.</div>');return}
  ensureYear();root.innerHTML=shell(U.view==='home'?viewHome():U.view==='course'?viewCourse():U.view==='proxy'?viewProxy():viewHome());
  const on=(s,f)=>document.querySelectorAll(s).forEach(el=>el.onclick=f);
  on('[data-view]',function(){U.view=this.dataset.view;render();scrollTo(0,0)});
  on('[data-cslot]',function(){U.cmpSlot=this.dataset.cslot;render()});
  const ys=$('#yearSel');if(ys)ys.onchange=e=>{U.year=e.target.value;U.sel=null;U.open={};U.topen={};render()};
  on('[data-open]',function(){U.sel=this.dataset.open;U.view='course';U.open={};U.topen={};U.g='';U.dept='';render();scrollTo(0,0)});
  on('[data-pick]',function(){U.sel=this.dataset.pick;U.open={};U.topen={};U.g='';U.dept='';render()});
  on('[data-g]',function(){U.g=this.dataset.g;U.open={};U.topen={};render()});
  on('[data-ls]',function(){const [key,k]=this.dataset.ls.split('|');U.ls=U.ls||{};const s=U.ls[key];U.ls[key]=s&&s.k===k?{k,d:s.d==='asc'?'desc':'asc'}:{k,d:'asc'};render()});
  on('[data-sort]',function(){const k=this.dataset.sort;U.sort=U.sort.k===k?{k,d:U.sort.d==='asc'?'desc':'asc'}:{k,d:(k==='d'||k==='rate')?'asc':'desc'};render()});
  on('tr[data-dept]',function(){const d=this.dataset.dept;const cur=U.my?U.open[d]!==false:!!U.open[d];U.open[d]=!cur;render()});
  const setMy=v=>{U.my=v;U.open={};U.topen={};try{v?localStorage.setItem('eduMyDept',v):localStorage.removeItem('eduMyDept')}catch(e){}render()};
  const ms=$('#mySel');if(ms)ms.onchange=e=>setMy(e.target.value);
  const mc=$('#myClear');if(mc)mc.onclick=()=>setMy('');
  document.querySelectorAll('tr[tabindex]').forEach(tr=>tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tr.click()}});
  on('tr[data-tview]',function(){const x=U._teams[+this.dataset.tview];U.topen[x.k]=!U.topen[x.k];render()});
  on('[data-sub]',function(){U.sub=this.dataset.sub;render()});
  on('[data-pf]',function(){U.pf=this.dataset.pf;render()});
  on('[data-pk]',function(){U.pk=this.dataset.pk;U.topen={};render()});
  const ss=$('#snapSel');if(ss)ss.onchange=e=>{U.snap[U._C.c]=+e.target.value;render()};
}

    <h1>로그인</h1><p>열람 비밀번호를 입력해 주세요.<br><span class="muted" style="font-size:.8rem">로그인은 1시간 동안 유지돼요.</span></p>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn primary" type="submit" id="go">로그인</button><div class="err" id="err">${msg||''}</div></form></div>`;
  $('#lockForm').onsubmit=async e=>{e.preventDefault();const pw=$('#pw').value;if(!pw)return;const go=$('#go');go.disabled=true;go.textContent='확인하는 중…';
    let r;try{r=await API.login(pw)}catch(err){r={error:'NET'}}
    if(r&&r.token){try{sessionStorage.setItem('eduViewSess',JSON.stringify({token:r.token,exp:r.exp}))}catch(e){}load();return}
    $('#err').textContent=r&&r.error==='BAD_PASSWORD'?'비밀번호가 맞지 않아요':r&&r.error==='NO_PASSWORD_SET'?'관리자가 아직 열람 비밀번호를 정하지 않았어요':'연결하지 못했어요. 잠시 뒤 다시 시도해 주세요';go.disabled=false;go.textContent='로그인'};
  setTimeout(()=>{const p=$('#pw');if(p)p.focus()},0)}
async function load(){const x=vsess();if(!x){showLogin();return}window.__LOADING=true;window.__FAILED=false;render();
  try{PUB=await API.data(x.token);window.__LOADING=false;render()}
  catch(e){if(/AUTH/.test(String(e&&e.message||e))){try{sessionStorage.removeItem('eduViewSess')}catch(_){}showLogin('로그인 시간이 지났어요. 다시 로그인해 주세요.')}else{window.__FAILED=true;render()}}}
document.addEventListener('click',async e=>{if(!e.target||e.target.id!=='extBtn')return;const x=vsess();if(!x)return;e.target.disabled=true;
  try{const r=await API.extend(x.token);if(r&&r.token){sessionStorage.setItem('eduViewSess',JSON.stringify({token:r.token,exp:r.exp}));const el=document.getElementById('leftT');if(el)el.textContent=leftText();vtoast('로그인 시간을 30분 연장했어요 · '+leftText())}else vtoast('연장하지 못했어요. 다시 로그인해 주세요')}catch(_){vtoast('연장하지 못했어요. 잠시 뒤 다시 눌러 주세요')}e.target.disabled=false});
function vtoast(m){let t=document.getElementById('vtoast');if(!t){t=document.createElement('div');t.id='vtoast';document.body.appendChild(t)}t.textContent=m;t.className='show';clearTimeout(vtoast._t);vtoast._t=setTimeout(()=>t.className='',2600)}
document.addEventListener('click',e=>{if(e.target&&(e.target.id==='outBtn'||e.target.id==='outBtn2')){try{sessionStorage.removeItem('eduViewSess')}catch(_){}showLogin()}});
setInterval(()=>{if(!PUB&&!window.__LOADING)return;if(document.getElementById('lockForm'))return;if(!vsess()){showLogin('로그인 1시간이 지나 자동으로 로그아웃됐어요. 다시 로그인해 주세요.');return}const el=document.getElementById('leftT');if(el)el.textContent=leftText()},20000);
window.__render=render;
load();
})();
